name: expense_tracker
description: "A production-ready Flutter Expense Tracker application matching architectural best practices."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Local Data Persistence
  shared_preferences: ^2.3.5

  # Internationalization & Date/Currency Formatting
  intl: ^0.20.2

  # Unique ID Generation for expense records
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Recommended Flutter Lints
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
